name: Helm Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Lint the chart
        run: helm lint --strict charts/checker

      # Renders the chart with `helm template` and loads the configuration with the Checker's
      # own code; no cluster needed.
      - name: Run the Helm unit tests
        run: make helm-test
