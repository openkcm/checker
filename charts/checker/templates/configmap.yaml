---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "checker.configMapName" . }}
  namespace: {{ include "checker.namespace" . }}
  labels:
    {{- include "checker.labels" . | nindent 4 }}
  {{- with .Values.configMap.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
immutable: {{ include "checker.configImmutable" . | eq "true" }}
data:
  config.yaml: |-
    {{- include "checker.config" . | nindent 4 }}
