{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "checker.fullname" . }}
  namespace: {{ include "checker.namespace" . }}
  labels:
    {{- include "checker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "checker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- with .Values.networkPolicy.http.from }}
    # Health check and versions endpoints: only the listed callers.
    - ports:
        - port: http
          protocol: TCP
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.networkPolicy.status.from }}
    # Status endpoints (version, metrics). Probes from the kubelet are not affected by
    # NetworkPolicies on most network plugins.
    - ports:
        - port: http-status
          protocol: TCP
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
