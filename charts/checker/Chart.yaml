apiVersion: v2
type: application
name: checker
description: >-
  The OpenKCM Checker: reports the health of a cluster (its services, the Kubernetes
  API server and the Linkerd service mesh) and the versions of its services over HTTP.
home: https://github.com/openkcm/checker
sources:
  - https://github.com/openkcm/checker
keywords:
  - openkcm
  - health-check
  - linkerd
  - monitoring
# Version of the chart. Increment it for every change to the chart.
# Versions follow Semantic Versioning (https://semver.org/).
version: 0.2.0
# Checker release this chart deploys by default: the tag of its image (default of image.tag).
# release-please updates it in each release pull request (marker on the line). Increase
# `version` in the same pull request, otherwise the chart release workflow skips the
# already-published chart version.
appVersion: "v0.3.2" # x-release-please-version
